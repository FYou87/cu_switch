[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "witch-switch"
version = "0.5.3"
description = "Cursor 中转站切换器"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7"]

[project.scripts]
witch = "witch.app:main"

[tool.setuptools.packages.find]
include = ["witch*"]
